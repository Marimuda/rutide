name: Build Python release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optionally publish the verified distributions from a protected tag
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check synchronized workspace and tag versions
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; packages = [p for p in json.load(sys.stdin)["packages"] if p["name"].startswith("rutide")]; versions = {p["version"] for p in packages}; assert len(versions) == 1, versions; print(versions.pop())')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            python: python3
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
            python: python3
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            python: python

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.98.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - name: Install and smoke-test wheel
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: >-
          ${{ matrix.python }} python/tests/install_artifact_and_smoke.py
          dist wheel "${{ needs.verify-version.outputs.version }}"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  source:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: verify-version
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.98.0
          command: sdist
          args: --out dist

      - name: Install and smoke-test source distribution
        run: >-
          python3 python/tests/install_artifact_and_smoke.py
          dist sdist "${{ needs.verify-version.outputs.version }}"

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-source
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_target == 'testpypi' &&
      github.ref_type == 'tag'
    needs: [wheels, source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Publish through TestPyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false

  publish-pypi:
    name: Publish to PyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_target == 'pypi' &&
      github.ref_type == 'tag'
    needs: [wheels, source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download immutable distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: false
