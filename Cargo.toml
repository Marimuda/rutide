[workspace]
members = [
  "crates/rutide-cli",
  "crates/rutide-core",
  "crates/rutide-python",
]
default-members = [
  "crates/rutide-cli",
  "crates/rutide-core",
  "crates/rutide-python",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jakup Svodstein <jakupsv@setur.fo>"]
license = "MIT"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
