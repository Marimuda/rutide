[package]
name = "rutide-cli"
description = "Command-line interface and benchmark application for RUTide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[[bin]]
name = "rutide"
path = "src/main.rs"

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["linalg", "rayon", "std"] }
mimalloc = "=0.1.52"
netcdf = { version = "=0.12.1", default-features = false }
rayon = "=1.12.0"
rutide-core = { path = "../rutide-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[lints]
workspace = true
