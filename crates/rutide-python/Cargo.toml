[package]
name = "rutide-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"
description = "Native Python extension for high-performance tidal harmonic analysis with RUTide"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "=0.29.0"
pyo3 = { version = "=0.29.2", features = ["abi3-py39"] }
rutide-core = { path = "../rutide-core", version = "=0.2.0" }

[lints]
workspace = true
