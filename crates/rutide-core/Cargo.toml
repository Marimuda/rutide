[package]
name = "rutide-core"
description = "Numerical core for RUTide harmonic analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["linalg", "rayon", "std"] }
rayon = "=1.12.0"
rustfft = "=6.4.1"

[[bench]]
name = "fixed_raw_throughput"
